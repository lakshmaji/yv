name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

env:
  GO_VERSION: "1.25.0"
  NODE_VERSION: "20"

jobs:
  build-macos:
    name: Build macOS (arm64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute short SHA
        id: vars
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Determine Wails CLI version
        id: wails_version
        run: |
          WAILS_VERSION=$(grep 'github.com/wailsapp/wails/v2 ' go.mod | awk '{print $2}')
          echo "version=$WAILS_VERSION" >> "$GITHUB_OUTPUT"

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ steps.wails_version.outputs.version }}

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build app (unsigned)
        run: ~/go/bin/wails build -platform darwin/arm64

      - name: Package DMG (unsigned)
        run: |
          mkdir -p /tmp/yv-dmg
          cp -r build/bin/yv.app /tmp/yv-dmg/
          hdiutil create -volname "yv" -srcfolder /tmp/yv-dmg -ov -format UDZO yv.dmg
          rm -rf /tmp/yv-dmg

      - name: Rename artifact
        run: mv yv.dmg "yv-macos-arm64-${{ steps.vars.outputs.sha }}.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: yv-macos-arm64
          path: yv-macos-arm64-${{ steps.vars.outputs.sha }}.dmg
          if-no-files-found: error

  build-windows:
    name: Build Windows (amd64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute short SHA
        id: vars
        shell: bash
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Determine Wails CLI version
        id: wails_version
        shell: bash
        run: |
          WAILS_VERSION=$(grep 'github.com/wailsapp/wails/v2 ' go.mod | awk '{print $2}')
          echo "version=$WAILS_VERSION" >> "$GITHUB_OUTPUT"

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ steps.wails_version.outputs.version }}

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build app (unsigned)
        shell: bash
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          wails build -platform windows/amd64

      - name: Rename artifact
        shell: bash
        run: cp build/bin/yv.exe "yv-windows-amd64-${{ steps.vars.outputs.sha }}.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: yv-windows-amd64
          path: yv-windows-amd64-${{ steps.vars.outputs.sha }}.exe
          if-no-files-found: error

  build-linux:
    name: Build Linux (amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute short SHA
        id: vars
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Determine Wails CLI version
        id: wails_version
        run: |
          WAILS_VERSION=$(grep 'github.com/wailsapp/wails/v2 ' go.mod | awk '{print $2}')
          echo "version=$WAILS_VERSION" >> "$GITHUB_OUTPUT"

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ steps.wails_version.outputs.version }}

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build app (unsigned)
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          wails build -platform linux/amd64

      - name: Package tar.gz
        run: |
          cd build/bin
          tar -czf "../../yv-linux-amd64-${{ steps.vars.outputs.sha }}.tar.gz" yv
          cd ../..

      - uses: actions/upload-artifact@v4
        with:
          name: yv-linux-amd64
          path: yv-linux-amd64-${{ steps.vars.outputs.sha }}.tar.gz
          if-no-files-found: error
