name: Release

# Versioning and tagging, split from Build on purpose.
#
# build.yml is verified working on macOS, Windows and Ubuntu and is not touched
# by any of this: it triggers on a `v*` tag and knows nothing about changesets.
# This workflow's whole job is to decide *what* that tag should be, create it,
# and open the Release that build.yml then attaches installers to.
#
#   1. PRs land on main, each carrying a .changeset/*.md saying patch/minor/major.
#   2. changesets/action keeps one version PR open and up to date while anything
#      is pending: consuming the changesets, bumping package.json, writing
#      CHANGELOG.md and mirroring the number into wails.json.
#   3. Merging that PR leaves nothing pending, so the action runs its `publish`
#      command instead — `changeset tag` writes v<version>, the action pushes it
#      and creates the GitHub Release with that version's changelog entry as the
#      body. See the note on `publish` below: without it this step is skipped.
#   4. The tag push starts build.yml, which uploads the installers to it.
#
# Merging the version PR is the release decision; nothing is tagged or published
# until someone does it.
#
# All of step 2 and 3 used to be hand-rolled shell here — a `find .changeset`
# pending count, a `git checkout -b` / commit / force-push block, a `gh pr view`
# guard around `gh pr create` with a printf-built body, and a second job that
# re-derived the version to tag it. changesets/action does all of it, and the two
# jobs collapsed into the one below.
#
# ── Why RELEASE_TOKEN, and why it is not optional ──────────────────────────
#
# GitHub suppresses workflow triggers for anything pushed with the automatic
# GITHUB_TOKEN, to stop a workflow looping on itself. That is not a corner case
# here, it is the whole mechanism: a tag pushed by github-actions[bot] is a tag
# build.yml never sees, which is exactly how v0.2.0 came to exist with no
# installers attached — the job that pushed it was green, and said so only in a
# step summary nobody reads.
#
# `commitMode` defaults to "git-cli", so the action pushes through the git remote
# actions/checkout configured. The token therefore has to be on the *checkout*,
# not only on the action. It is on both: checkout for the tag push, github-token
# for the PR and release API calls.
#
# Needs `contents: write` and `pull-requests: write`.

on:
  push:
    branches: [main]

permissions:
  contents: read

# One release at a time. Two pushes in quick succession would otherwise race to
# force-update the same version branch.
concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # `token` is a *required* input to actions/checkout, so an unset
      # RELEASE_TOKEN does not fall back to anything — it resolves to "" and
      # checkout stops with `Input required and not supplied: token`, which names
      # neither the secret nor the reason this workflow insists on one. Failing
      # here instead costs one step and says what to do.
      #
      # Deliberately not `secrets.RELEASE_TOKEN || github.token`: that would start
      # the workflow succeeding again while pushing tags as github-actions[bot],
      # which raises no event, so build.yml would go back to never running and
      # releases would go back to being bare tags — green, and wrong. A missing
      # token should stop the release, not silently produce half of one.
      - name: RELEASE_TOKEN must be set
        env:
          HAS_TOKEN: ${{ secrets.RELEASE_TOKEN != '' }}
        run: |
          if [[ "$HAS_TOKEN" == "true" ]]; then
            exit 0
          fi
          {
            echo "### RELEASE_TOKEN is not set"
            echo ""
            echo "Add a personal access token with \`contents: write\` and"
            echo "\`pull-requests: write\` at **Settings → Secrets and variables →"
            echo "Actions**, named \`RELEASE_TOKEN\`."
            echo ""
            echo "It cannot be replaced by the automatic \`GITHUB_TOKEN\`: GitHub"
            echo "raises no workflow event for anything that token pushes, so the"
            echo "release tag would never start Build and the release would carry"
            echo "no installers. See RELEASING.md."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::RELEASE_TOKEN is not set — see the job summary. A tag pushed with GITHUB_TOKEN does not start Build, so the release would have no installers."
          exit 1

      - uses: actions/checkout@v4
        with:
          # Tags are needed to tell "already released" from "not yet", and the
          # credential persisted from here is what pushes the new one.
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"

      - name: Install
        run: bun install --frozen-lockfile

      # Pinned to the v1.9.0 commit rather than a moving tag. The input names
      # changed in v2 (`version` -> `version-script` and so on) and Actions
      # ignores inputs it does not recognise *silently*, so a float onto v2 would
      # not fail — it would quietly stop running `bun run version`, skip
      # sync-version.mjs, and leave wails.json behind package.json until
      # version_test.go failed the tag build for reasons pointing nowhere near
      # here.
      #
      # `version` is `changeset version && node scripts/sync-version.mjs`, so
      # wails.json comes along with package.json.
      #
      # `publish` is a misnomer for this repo — there is no npm package, the root
      # package.json is only a version anchor — but it is **required**, and not
      # because tagging is being hand-rolled. The action
      # does no tagging of its own: pushing the tag and opening the release both
      # live inside its runPublish, and its dispatch switch opens with
      #
      #   case !hasChangesets && !hasPublishScript:
      #     core.info("... Not publishing because no publish script found."); return
      #
      # So with this line absent, merging the version PR does nothing at all —
      # no tag, no release, no build, and an info-level log as the only trace.
      #
      # `changeset tag` rather than `changeset publish`, which would attempt a
      # registry call. Passed inline: it is one command, so a package.json script
      # would only add a name to look up. `version` earns its script because it is
      # two commands that must not come apart.
      #
      # If the root package.json ever goes back to `private: true`, tagging then
      # depends on `privatePackages.tag` in .changeset/config.json — which is set,
      # precisely so that flip cannot silently stop this printing a "New tag:"
      # line and take the whole release chain down with nothing red.
      #
      # @changesets/changelog-github makes an API call per entry to name each
      # changeset's PR and author, and reads its credential from GITHUB_TOKEN.
      # The action passes github-token through to both scripts, so that is
      # covered.
      - uses: changesets/action@3841a0683d3cfa6dae0f9bb335290003010fe3f0 # v1.9.0
        with:
          version: bun run version
          publish: bunx changeset tag
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
          github-token: ${{ secrets.RELEASE_TOKEN }}
