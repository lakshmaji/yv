name: Release

# Versioning, split from Build on purpose.
#
# build.yml is verified working on macOS and Ubuntu and is not touched by any of
# this: it still triggers on a `v*` tag and knows nothing about changesets. This
# workflow's whole job is to decide *what* that tag should be and to create it.
#
#   1. PRs land on main, each carrying a .changeset/*.md saying patch/minor/major.
#   2. Someone runs the "version" job from the Actions tab. It consumes the
#      pending changesets, bumps package.json, writes CHANGELOG.md, mirrors the
#      number into wails.json, and opens a PR.
#   3. Merging that PR trips the "tag" job below, which pushes v<version>.
#   4. build.yml sees the tag and builds, signs and publishes.
#
# Step 2 is deliberately manual rather than a bot that reopens a PR on every
# push. Releases here are a decision, not a cadence.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Consume pending changesets and open a version PR"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  # ── Open the version PR ─────────────────────────────────────────────────
  version:
    name: Version
    if: github.event_name == 'workflow_dispatch' && inputs.version
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"

      - name: Install
        run: bun install --frozen-lockfile

      # Nothing to release is a normal outcome, not a failure — someone may have
      # run this before any changeset landed.
      - name: Check for pending changesets
        id: pending
        run: |
          count=$(find .changeset -name '*.md' -not -name 'README.md' | wc -l | tr -d ' ')
          echo "count=$count" >> "$GITHUB_OUTPUT"
          if [[ "$count" == "0" ]]; then
            echo "No pending changesets — nothing to version." >> "$GITHUB_STEP_SUMMARY"
          fi

      # `bun run version` is `changeset version && node scripts/sync-version.mjs`,
      # so wails.json comes along with package.json. version_test.go fails the
      # build if it ever does not.
      - name: Apply version bump
        if: steps.pending.outputs.count != '0'
        run: bun run version

      - name: Read the new version
        if: steps.pending.outputs.count != '0'
        id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # gh rather than a third-party PR action, for the same reason the release
      # job in build.yml uses it: this token can write to the repo, and that is
      # not something to hand to an external action.
      - name: Open the version PR
        if: steps.pending.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.v.outputs.version }}"
          BRANCH="release/v${VERSION}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "chore(release): v${VERSION}"
          git push --force origin "$BRANCH"

          # --force above plus this guard makes the job re-runnable: a second run
          # updates the existing PR instead of failing on a duplicate.
          if ! gh pr view "$BRANCH" --json number >/dev/null 2>&1; then
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "chore(release): v${VERSION}" \
              --body "Consumes the pending changesets. Merging this pushes the \`v${VERSION}\` tag, which starts the Build workflow."
          fi
          echo "Opened release/v${VERSION}" >> "$GITHUB_STEP_SUMMARY"

  # ── Tag once the version PR merges ──────────────────────────────────────
  tag:
    name: Tag
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Tags are needed to tell "already released" from "not yet".
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # A tag pushed with the default GITHUB_TOKEN does not start another
          # workflow — GitHub blocks that to stop a workflow looping on itself.
          # So build.yml would never see it. RELEASE_TOKEN (a PAT with `contents:
          # write`) is what makes the handoff work; without it the tag is still
          # created and the step below says how to start the build by hand.
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      - name: Tag if this is a new version
        env:
          HAS_PAT: ${{ secrets.RELEASE_TOKEN != '' }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists — nothing to do." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # A version bump with changesets still pending means someone edited
          # package.json by hand mid-flight. Tagging then would release a version
          # whose changelog is incomplete.
          if [[ $(find .changeset -name '*.md' -not -name 'README.md' | wc -l) -ne 0 ]]; then
            echo "Version is $VERSION but changesets are still pending — not tagging." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG"
          git push origin "$TAG"

          if [[ "$HAS_PAT" == "true" ]]; then
            echo "Pushed $TAG — Build is starting." >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "Pushed **$TAG**, but with the default token, so Build did not start."
              echo ""
              echo "Either add a \`RELEASE_TOKEN\` secret, or re-push the tag locally:"
              echo '```'
              echo "git fetch --tags && git push --force origin $TAG"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
